# Temporary HTTP-only Nginx config used before Let's Encrypt SSL certificates exist.
# After running certbot, replace with deploy/nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name socialadlinker.com www.socialadlinker.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

