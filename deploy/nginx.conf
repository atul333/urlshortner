# SocialAdLinker Production Nginx Reverse Proxy Config
# Place at /etc/nginx/sites-available/socialadlinker.conf and symlink to sites-enabled

limit_req_zone $binary_remote_addr zone=sal_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sal_unlock:10m rate=10r/s;

# Redirect apex domain to www.socialadlinker.com over HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name socialadlinker.com www.socialadlinker.com;
    return 301 https://www.socialadlinker.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socialadlinker.com;

    # Certbot will populate SSL directives or share cert with www
    ssl_certificate     /etc/letsencrypt/live/www.socialadlinker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.socialadlinker.com/privkey.pem;

    return 301 https://www.socialadlinker.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.socialadlinker.com;

    ssl_certificate     /etc/letsencrypt/live/www.socialadlinker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.socialadlinker.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1m;

    # Strict security headers (in addition to Express Helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Rate limit unlock & redirect gates at the edge
    location ~ ^/(api/unlock|go)/ {
        limit_req zone=sal_unlock burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit API endpoints
    location /api {
        limit_req zone=sal_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

